<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wer kennt wer (WG Edition)</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Arial Rounded MT Bold', 'Nunito', Arial, sans-serif; background: #a4cb6e; color: white; }
    #graph { width: 100vw; height: 100vh; }
    #info {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: #faebd7; color: #1a1a2e;
      padding: 8px 12px; border-radius: 12px;
      border: 2px solid #1a1a2e;
      box-shadow: 3px 3px 0 #1a1a2e;
      font-size: 13px;
    }
    #info strong { font-weight: 900; font-size: 13px; }
    #info small { color: #555; font-size: 11px; }
    #qrToggle {
      padding: 5px 12px; border-radius: 10px;
      border: 2px solid #1a1a2e; background: white; color: #1a1a2e;
      font-size: 12px; font-weight: 800; cursor: pointer;
      font-family: inherit; white-space: nowrap;
    }
    #qrToggle:hover { background: #f5a623; }
    #qrContent { display: none; clear: both; margin-top: 10px; text-align: left; }
    #qrContent.open { display: block; }
    #qrcode canvas, #qrcode img { border-radius: 6px; }
    #qrUrl { font-size: 11px; color: #666; margin-top: 4px; word-break: break-all; max-width: 200px; }
    #stats {
      position: fixed; bottom: 12px; left: 12px; z-index: 10;
      background: #faebd7; color: #1a1a2e;
      padding: 8px 12px; border-radius: 12px;
      border: 2px solid #1a1a2e;
      box-shadow: 3px 3px 0 #1a1a2e;
      font-size: 12px; line-height: 1.7;
    }
    #stats .stat-value { font-weight: 900; font-size: 17px; color: #e8387a; }
    #tooltip {
      display: none; position: fixed;
      background: #faebd7; color: #1a1a2e;
      border: 2px solid #1a1a2e;
      padding: 10px 14px; border-radius: 10px;
      pointer-events: none; font-size: 14px; font-weight: 700;
      box-shadow: 2px 2px 0 #1a1a2e;
    }
    a { color: #f5a623; font-weight: 700; }

    #chatBtn {
      position: fixed; bottom: 24px; right: 24px; z-index: 20;
      width: 56px; height: 56px; border-radius: 50%;
      background: #e8387a; border: 2px solid #1a1a2e; color: white;
      font-size: 24px; cursor: pointer;
      box-shadow: 3px 3px 0 #1a1a2e;
      display: flex; align-items: center; justify-content: center;
    }
    #chatBadge {
      display: none; position: absolute; top: 0px; right: 0px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #f5a623; border: 2px solid #1a1a2e;
    }
    #chatPanel {
      position: fixed; top: 0; left: 0; right: 0;
      height: 100vh; height: 100dvh;
      z-index: 30; background: #faebd7;
      display: none; flex-direction: column; overflow: hidden;
    }
    #chatHeader {
      padding: 14px 16px; font-weight: 900; font-size: 16px; color: #1a1a2e;
      border-bottom: 2px solid #d4c4b0; flex-shrink: 0;
      display: flex; align-items: center; gap: 12px;
      background: #f5a623;
    }
    #chatBack {
      background: none; border: none; color: #1a1a2e;
      font-size: 22px; cursor: pointer; padding: 0; line-height: 1; font-weight: 900;
    }
    #chatMessages {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
      background: #faebd7;
    }
    #chatMessages::-webkit-scrollbar { width: 4px; }
    #chatMessages::-webkit-scrollbar-thumb { background: #d4c4b0; border-radius: 2px; }
    #chatInputRow {
      display: flex; gap: 8px; padding: 10px 12px;
      border-top: 2px solid #d4c4b0; flex-shrink: 0;
      background: #faebd7;
    }
    #chatText {
      flex: 1; padding: 8px 12px; border-radius: 20px;
      border: 2px solid #1a1a2e; background: white; color: #1a1a2e;
      font-size: 16px; outline: none; font-family: inherit;
    }
    #chatText::placeholder { color: #aaa; }
    #chatSendBtn {
      width: 36px; height: 36px; border-radius: 50%;
      background: #e8387a; border: 2px solid #1a1a2e; color: white;
      font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; box-shadow: 2px 2px 0 #1a1a2e;
    }
    .msg-wrap { display: flex; flex-direction: column; }
    .msg-wrap.me { align-items: flex-end; }
    .msg-name { font-size: 11px; font-weight: 700; margin-bottom: 2px; padding: 0 2px; color: #555; }
    .msg-bubble {
      max-width: 220px; padding: 8px 12px; font-size: 14px;
      word-wrap: break-word; line-height: 1.4; font-weight: 600;
    }
    .msg-wrap.me .msg-bubble { border-radius: 14px 14px 4px 14px; border: 2px solid #1a1a2e; }
    .msg-wrap.other .msg-bubble { border-radius: 14px 14px 14px 4px; background: white; color: #1a1a2e; border: 2px solid #d4c4b0; }
    .msg-time { font-size: 10px; color: #999; margin-top: 2px; padding: 0 2px; }
  </style>
</head>
<body>
  <div id="info">
    <strong>🌸 Wer kennt wen (WG Edition) 🌸</strong><br>
    <small>Klick uf eppert für meh infos</small><br>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px">
      <a href="/">&#x2190; Zrug zum profil</a>
      <button id="qrToggle" onclick="toggleQR()">QR ▼</button>
    </div>
    <div id="qrContent">
      <div id="qrcode"></div>
      <div id="qrUrl"></div>
    </div>
  </div>
  <div id="tooltip"></div>
  <div id="stats">
    <div><span class="stat-value" id="statPeople">0</span> lüüt</div>
    <div><span class="stat-value" id="statConnections">0</span> connections</div>
    <div><span class="stat-value" id="statDrunk">-</span> /10 trinke 🍺</div>
    <div id="statTop" style="color:#666;font-size:11px;font-weight:700"></div>
  </div>
  <div id="graph"></div>

  <button id="chatBtn" onclick="toggleChat()">
    💬
    <span id="chatBadge"></span>
  </button>
  <div id="chatPanel">
    <div id="chatHeader">
      <button id="chatBack" onclick="toggleChat()">&#x2190;</button>
      💬 Chat
    </div>
    <div id="chatMessages"></div>
    <div id="chatInputRow">
      <input id="chatText" placeholder="Nachricht…" maxlength="500" />
      <button id="chatSendBtn" onclick="sendMessage()">&#x2192;</button>
    </div>
  </div>

  <script>
    function toggleQR() {
      const content = document.getElementById('qrContent')
      const btn = document.getElementById('qrToggle')
      const open = content.classList.toggle('open')
      btn.textContent = open ? 'QR code ▲' : 'QR code ▼'
    }

    fetch('/api/config').then(r => r.json()).then(({ publicUrl }) => {
      const url = publicUrl || globalThis.location.origin
      const _qr = new QRCode(document.getElementById('qrcode'), { text: url, width: 160, height: 160 })
      document.getElementById('qrUrl').textContent = url
    })

    const myId = localStorage.getItem('myId')
    let chatOpen = false
    let lastSeenCount = 0
    let allMessages = []
    let latestPeople = []

    const chatPanel = document.getElementById('chatPanel')

    function setChatSize() {
      const vv = window.visualViewport
      chatPanel.style.height = (vv ? vv.height : window.innerHeight) + 'px'
      chatPanel.style.top = (vv ? vv.offsetTop : 0) + 'px'
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => { if (chatOpen) { setChatSize(); scrollChatToBottom() } })
      window.visualViewport.addEventListener('scroll', () => { if (chatOpen) setChatSize() })
    }

    function toggleChat() {
      chatOpen = !chatOpen
      if (chatOpen) {
        setChatSize()
        chatPanel.style.display = 'flex'
        document.body.style.overflow = 'hidden'
        document.body.style.position = 'fixed'
        document.body.style.width = '100%'
        lastSeenCount = allMessages.length
        document.getElementById('chatBadge').style.display = 'none'
        renderMessages(allMessages)
      } else {
        chatPanel.style.display = 'none'
        chatPanel.style.height = ''
        chatPanel.style.top = ''
        document.body.style.overflow = ''
        document.body.style.position = ''
        document.body.style.width = ''
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && chatOpen) sendMessage()
    })

    async function sendMessage() {
      if (!myId) return
      const input = document.getElementById('chatText')
      const text = input.value.trim()
      if (!text) return
      input.value = ''
      await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fromId: myId, text })
      })
      const { messages } = await fetch('/api/messages').then(r => r.json())
      allMessages = messages
      lastSeenCount = messages.length
      renderMessages(messages)
    }

    function renderMessages(messages) {
      allMessages = messages
      const people = latestPeople
      const container = document.getElementById('chatMessages')
      const atBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 60
      container.innerHTML = ''

      messages.forEach(msg => {
        const sender = people.find(p => p.id === msg.fromId)
        const isMe = msg.fromId === myId
        const color = sender?.color || '#4a90d9'
        const lightBg = ['#ffd700', '#ff69b4'].includes(color)
        const emojiPrefix = sender?.emoji ? sender.emoji + ' ' : ''
        const name = sender ? emojiPrefix + sender.name : '?'
        const time = new Date(Number.parseInt(msg.id)).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })

        const wrap = document.createElement('div')
        wrap.className = 'msg-wrap ' + (isMe ? 'me' : 'other')

        const nameEl = document.createElement('div')
        nameEl.className = 'msg-name'
        nameEl.style.color = isMe ? '#bbb' : color
        nameEl.textContent = name
        wrap.appendChild(nameEl)

        const bubble = document.createElement('div')
        bubble.className = 'msg-bubble'
        if (isMe) bubble.style.cssText = `background:${color}; color:${lightBg ? '#333' : 'white'};`
        bubble.textContent = msg.text
        wrap.appendChild(bubble)

        const timeEl = document.createElement('div')
        timeEl.className = 'msg-time'
        timeEl.textContent = time
        wrap.appendChild(timeEl)

        container.appendChild(wrap)
      })

      if (atBottom || chatOpen) scrollChatToBottom()
    }

    function scrollChatToBottom() {
      const c = document.getElementById('chatMessages')
      c.scrollTop = c.scrollHeight
    }

    async function pollMessages() {
      const { messages } = await fetch('/api/messages').then(r => r.json())
      const hasNew = messages.length > allMessages.length
      allMessages = messages
      if (chatOpen) {
        renderMessages(messages)
      } else if (hasNew) {
        document.getElementById('chatBadge').style.display = 'block'
      }
    }

    setInterval(() => { void pollMessages() }, 3000)
    void pollMessages()

    function buildGraphData(people) {
      const connectionCount = {}
      people.forEach(p => { connectionCount[p.id] = 0 })
      const edges = []
      const seen = new Set()
      for (const p of people) {
        for (const toId of p.knows) {
          const key = [p.id, toId].sort().join('|')
          if (seen.has(key)) continue
          seen.add(key)
          edges.push({ id: key, from: p.id, to: toId, color: { color: '#faebd7', highlight: '#faebd7', opacity: 0.8 } })
          connectionCount[p.id]++
          connectionCount[toId]++
        }
      }
      const nodes = people.map(p => {
        const bg = p.color || '#4a90d9'
        const lightBg = ['#ffd700', '#ff69b4'].includes(bg)
        const label = (p.emoji ? p.emoji + ' ' : '') + p.name
        return {
          id: p.id,
          label,
          color: { background: bg, border: bg, highlight: { background: bg, border: '#fff' } },
          font: { color: lightBg ? '#333' : 'white', size: 14 }
        }
      })
      return { nodes, edges }
    }

    async function fetchPeople() {
      const res = await fetch('/api/people')
      const { people } = await res.json()
      return people
    }

    async function init() {
      const people = await fetchPeople()
      const { nodes, edges } = buildGraphData(people)

      const nodeSet = new vis.DataSet(nodes)
      const edgeSet = new vis.DataSet(edges)

      const network = new vis.Network(
        document.getElementById('graph'),
        { nodes: nodeSet, edges: edgeSet },
        {
          physics: { stabilization: false, barnesHut: { gravitationalConstant: -3000 } },
          interaction: { hover: false },
          nodes: { shape: 'ellipse', borderWidth: 2, shadow: { enabled: true, color: 'rgba(0,0,0,0.4)', size: 8 } },
          edges: { width: 2, smooth: { type: 'continuous' } }
        }
      )

      let currentPeople = people
      latestPeople = people

      function updateStats(people, edges) {
        document.getElementById('statPeople').textContent = people.length
        document.getElementById('statConnections').textContent = edges.length
        const withDrunk = people.filter(p => p.drunkLevel != null)
        if (withDrunk.length > 0) {
          const avg = (withDrunk.reduce((s, p) => s + p.drunkLevel, 0) / withDrunk.length).toFixed(1)
          document.getElementById('statDrunk').textContent = avg
        }
        const top = people.reduce((a, b) => {
          const ca = edges.filter(e => e.from === a.id || e.to === a.id).length
          const cb = edges.filter(e => e.from === b.id || e.to === b.id).length
          return cb > ca ? b : a
        }, people[0])
        if (top) {
          const label = (top.emoji ? top.emoji + ' ' : '') + top.name
          document.getElementById('statTop').textContent = '🌸 most connected: ' + label
        }
      }

      function spotlight(nodeId, originalColor) {
        let count = 0
        const interval = setInterval(() => {
          nodeSet.update({ id: nodeId, color: { background: count % 2 === 0 ? '#ffffff' : originalColor, border: '#ffffff' } })
          count++
          if (count >= 6) {
            clearInterval(interval)
            nodeSet.update({ id: nodeId, color: { background: originalColor, border: originalColor } })
          }
        }, 300)
      }

      updateStats(people, edges)

      const tooltip = document.getElementById('tooltip')

      network.on('click', params => {
        if (params.nodes.length === 0) { tooltip.style.display = 'none'; return }
        const nodeId = params.nodes[0]
        const person = currentPeople.find(p => p.id === nodeId)
        const count = currentPeople.filter(p =>
          p.id !== nodeId && (person.knows.includes(p.id) || p.knows.includes(nodeId))
        ).length
        tooltip.style.display = 'block'
        tooltip.style.left = params.event.srcEvent.clientX + 15 + 'px'
        tooltip.style.top = params.event.srcEvent.clientY + 15 + 'px'
        tooltip.innerHTML = `<strong>${person.name}</strong>${person.drunkLevel != null ? '<br>🍻 ' + person.drunkLevel + '/10' : ''}<br>${count} connection${count !== 1 ? 's' : ''}`
      })

      setInterval(async () => {
        const fresh = await fetchPeople()
        const { nodes: newNodes, edges: newEdges } = buildGraphData(fresh)
        currentPeople = fresh
        latestPeople = fresh

        const existingNodeIds = new Set(nodeSet.getIds())
        const existingEdgeIds = new Set(edgeSet.getIds())

        newNodes.forEach(n => {
          if (existingNodeIds.has(n.id)) nodeSet.update(n)
          else {
            nodeSet.add(n)
            spotlight(n.id, n.color.background)
          }
        })

        newEdges.forEach(e => {
          if (existingEdgeIds.has(e.id)) edgeSet.update(e)
          else edgeSet.add(e)
        })

        existingEdgeIds.forEach(id => {
          if (!newEdges.some(e => e.id === id)) edgeSet.remove(id)
        })

        updateStats(fresh, newEdges)
      }, 5000)
    }

    void init()
  </script>
</body>
</html>
