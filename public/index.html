<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wer kennt wer (WG Edition)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Arial Rounded MT Bold', 'Nunito', Arial, sans-serif;
      max-width: 600px; margin: 0 auto; padding: 20px 20px 40px;
      background: #a4cb6e; min-height: 100vh;
    }
    h1 {
      color: #1a1a2e; font-size: clamp(16px, 4.8vw, 26px); font-weight: 900;
      letter-spacing: -0.5px; margin: 0 0 20px; white-space: nowrap;
    }
    h2 { color: #1a1a2e; font-size: 19px; font-weight: 800; margin: 0 0 14px; }

    .card {
      background: #faebd7; border-radius: 16px; padding: 20px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      padding: 10px 14px; font-size: 16px; width: 220px;
      border: 2px solid #1a1a2e; border-radius: 10px;
      background: white; color: #1a1a2e; outline: none;
      font-family: inherit;
    }
    input[type="text"]:focus { border-color: #e8387a; }

    button.primary {
      padding: 10px 22px; font-size: 16px; font-weight: 800;
      cursor: pointer; border: none; border-radius: 12px;
      background: #f5a623; color: #1a1a2e;
      font-family: inherit; letter-spacing: 0.3px;
      box-shadow: 0 3px 0 #c4820e;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #c4820e; }

    .picker-label { margin: 14px 0 6px; font-weight: 800; color: #1a1a2e; font-size: 14px; }

    .color-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .color-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid transparent; cursor: pointer;
      transition: transform 0.1s;
    }
    .color-btn.selected { border-color: #1a1a2e; box-shadow: 0 0 0 2px #faebd7, 0 0 0 4px #1a1a2e; transform: scale(1.15); }

    .emoji-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .emoji-btn {
      width: 42px; height: 42px; font-size: 22px;
      border: 2px solid #d4c4b0; border-radius: 10px;
      background: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.1s;
    }
    .emoji-btn.selected { border-color: #1a1a2e; background: #faebd7; }
    .emoji-btn.none-btn { font-size: 14px; color: #999; }

    #peopleList { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .person-btn {
      padding: 10px 16px; border: 2px solid #d4c4b0;
      border-radius: 10px; background: white;
      cursor: pointer; font-size: 15px; font-family: inherit;
      color: #1a1a2e; font-weight: 600;
      transition: border-color 0.1s, background 0.1s;
    }
    .person-btn:hover { border-color: #f5a623; }
    .person-btn.known {
      background: #e8387a; border-color: #e8387a;
      color: white; font-weight: 800;
    }

    #profileLine { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    #profileBadge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 16px; border-radius: 20px;
      font-size: 16px; font-weight: 800; color: white;
    }
    #editToggle {
      font-size: 13px; cursor: pointer; font-weight: 700;
      padding: 6px 14px; border-radius: 20px;
      border: 2px solid #1a1a2e; background: white; color: #1a1a2e;
      font-family: inherit;
    }
    #editToggle:hover { background: #f5a623; border-color: #f5a623; }

    #editSection {
      background: white; border-radius: 12px; padding: 14px;
      margin: 10px 0; border: 2px solid #d4c4b0;
    }

    #qrSection {
      background: #faebd7; border-radius: 16px; padding: 16px;
      margin-top: 16px;
    }
    #qrSection p { color: #1a1a2e; margin: 0 0 10px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>🌸 Wer kennt wen (WG Edition) 🌸</h1>

  <div id="registerSection" class="card">
    <h2>Join de party 🌸</h2>
    <input id="nameInput" type="text" placeholder="Din name" onkeydown="if(event.key==='Enter') register()" /><br>

    <div class="picker-label">Wähl en farb</div>
    <div class="color-row" id="regColorPicker"></div>

    <div class="picker-label">Wähl en emoji <span style="font-weight:normal;color:#999">(optional)</span></div>
    <div class="emoji-grid" id="regEmojiPicker"></div>

    <div class="picker-label">Wie betrunke wirsch hütt si?</div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
      <input id="regDrunkLevel" type="range" min="0" max="10" value="5" style="width:180px;accent-color:#e8387a"
        oninput="document.getElementById('regDrunkVal').textContent=this.value" />
      <span id="regDrunkVal" style="font-size:22px;font-weight:900;color:#e8387a;min-width:24px">5</span>
    </div>
    <br>
    <button class="primary" onclick="register()">Join &rarr;</button>
  </div>

  <div id="mainSection" style="display:none">
    <div class="card" style="padding:14px 20px">
      <div id="profileLine">
        <span id="profileBadge"></span>
        <button id="editToggle" onclick="toggleEdit()">✏️ Profil bearbeite</button>
      </div>

      <div id="editSection" style="display:none">
        <div class="picker-label">Farb</div>
        <div class="color-row" id="editColorPicker"></div>
        <div class="picker-label">Emoji</div>
        <div class="emoji-grid" id="editEmojiPicker"></div>
        <div class="picker-label">Wie betrunke wirsch hütt si?</div>
        <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
          <input id="editDrunkLevel" type="range" min="0" max="10" value="5" style="width:180px;accent-color:#e8387a"
            oninput="document.getElementById('editDrunkVal').textContent=this.value" />
          <span id="editDrunkVal" style="font-size:22px;font-weight:900;color:#e8387a;min-width:24px">5</span>
        </div>
        <br>
        <button class="primary" onclick="saveProfile()">Speichere</button>
      </div>
    </div>

    <div class="card">
      <p style="margin:0 0 12px;color:#1a1a2e;font-weight:700;font-size:14px">Klick d lüüt a wo d kennsch. Klick nomal zums lösche.</p>
      <div id="peopleList"></div>
      <br>
      <button class="primary" onclick="viewGraph()">Gahn zum graph &rarr;</button>
    </div>
  </div>

  <div id="qrSection">
    <p>Share de QR-Code:</p>
    <div id="qrcode"></div>
    <p style="font-size:12px;color:#555;margin:6px 0 0" id="appUrl"></p>
    <button onclick="document.getElementById('urlOverrideSection').style.display='block';this.style.display='none'" style="font-size:11px;color:#666;cursor:pointer;user-select:none;background:none;border:none;padding:4px 0;margin-top:6px;font-family:inherit">⚙ host settings</button>
    <div id="urlOverrideSection" style="display:none;margin-top:8px">
      <input id="urlOverride" type="text" placeholder="Paste tunnel URL (e.g. https://xxx.trycloudflare.com)" style="width:280px;font-size:13px" />
      <button onclick="updateQR()" style="font-size:13px;padding:6px 10px;cursor:pointer;border-radius:8px;border:2px solid #1a1a2e;background:#f5a623;font-weight:700;font-family:inherit">Update QR</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <script>
    const PALETTE = [
      { name: 'blue',   hex: '#4a90d9' },
      { name: 'pink',   hex: '#ff69b4' },
      { name: 'yellow', hex: '#ffd700' },
      { name: 'green',  hex: '#2ecc71' },
      { name: 'red',    hex: '#e74c3c' },
      { name: 'violet', hex: '#9b59b6' },
    ]
    const EMOJIS = ['🎉','😊','😎','🔥','💎','🌟','🍕','🎸','🦄','🐱','🚀','🌈','🍺','👑','🦊','💪','🎭','🤗']

    let myId         = localStorage.getItem('myId')
    let myName       = localStorage.getItem('myName')
    let myColor      = localStorage.getItem('myColor') || '#4a90d9'
    let myEmoji      = localStorage.getItem('myEmoji') || ''
    let myDrunkLevel = localStorage.getItem('myDrunkLevel') !== null ? Number(localStorage.getItem('myDrunkLevel')) : 5

    let regColor = myColor
    let regEmoji = myEmoji
    let editColor = myColor
    let editEmoji = myEmoji

    buildPicker('regColorPicker',  'regEmojiPicker',  regColor,  regEmoji,
      c => regColor = c, e => regEmoji = e)
    buildPicker('editColorPicker', 'editEmojiPicker', myColor, myEmoji,
      c => editColor = c, e => editEmoji = e)

    if (myId) void showMain()

    function renderQR(url) {
      document.getElementById('appUrl').textContent = url
      document.getElementById('qrcode').innerHTML = ''
      const _qr = new QRCode(document.getElementById('qrcode'), { text: url, width: 128, height: 128 })
    }
    async function updateQR() {
      const val = document.getElementById('urlOverride').value.trim()
      if (!val) return
      await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ publicUrl: val })
      })
      renderQR(val)
      document.getElementById('urlOverrideSection').style.display = 'none'
    }
    fetch('/api/config').then(r => r.json()).then(({ publicUrl }) => {
      renderQR(publicUrl || globalThis.location.origin)
    })

    function buildPicker(colorId, emojiId, selColor, selEmoji, onColor, onEmoji) {
      const colorEl = document.getElementById(colorId)
      PALETTE.forEach(c => {
        const btn = document.createElement('button')
        btn.className = 'color-btn' + (c.hex === selColor ? ' selected' : '')
        btn.style.background = c.hex
        btn.title = c.name
        btn.onclick = () => {
          colorEl.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'))
          btn.classList.add('selected')
          onColor(c.hex)
        }
        colorEl.appendChild(btn)
      })

      const emojiEl = document.getElementById(emojiId)
      const noneBtn = document.createElement('button')
      noneBtn.className = 'emoji-btn none-btn' + (!selEmoji ? ' selected' : '')
      noneBtn.textContent = '✕'
      noneBtn.title = 'No emoji'
      noneBtn.onclick = () => {
        emojiEl.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'))
        noneBtn.classList.add('selected')
        onEmoji('')
      }
      emojiEl.appendChild(noneBtn)

      EMOJIS.forEach(e => {
        const btn = document.createElement('button')
        btn.className = 'emoji-btn' + (e === selEmoji ? ' selected' : '')
        btn.textContent = e
        btn.onclick = () => {
          emojiEl.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'))
          btn.classList.add('selected')
          onEmoji(e)
        }
        emojiEl.appendChild(btn)
      })
    }

    function updateBadge() {
      const badge = document.getElementById('profileBadge')
      badge.style.background = myColor
      badge.textContent = (myEmoji ? myEmoji + ' ' : '') + myName
    }

    async function register() {
      const name = document.getElementById('nameInput').value.trim()
      if (!name) return

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, color: regColor, emoji: regEmoji, drunkLevel: Number(document.getElementById('regDrunkLevel').value) })
      })
      const data = await res.json()
      myId         = data.id
      myName       = name
      myColor      = data.color || regColor
      myEmoji      = data.emoji ?? regEmoji
      myDrunkLevel = Number(document.getElementById('regDrunkLevel').value)
      localStorage.setItem('myId',         myId)
      localStorage.setItem('myName',       myName)
      localStorage.setItem('myColor',      myColor)
      localStorage.setItem('myEmoji',      myEmoji)
      localStorage.setItem('myDrunkLevel', myDrunkLevel)
      await showMain()
    }

    function toggleEdit() {
      const s = document.getElementById('editSection')
      s.style.display = s.style.display === 'none' ? 'block' : 'none'
    }

    async function saveProfile() {
      myColor      = editColor
      myEmoji      = editEmoji
      myDrunkLevel = Number(document.getElementById('editDrunkLevel').value)
      localStorage.setItem('myColor',      myColor)
      localStorage.setItem('myEmoji',      myEmoji)
      localStorage.setItem('myDrunkLevel', myDrunkLevel)
      await fetch('/api/people/' + myId, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ color: myColor, emoji: myEmoji, drunkLevel: myDrunkLevel })
      })
      updateBadge()
      document.getElementById('editSection').style.display = 'none'
    }

    async function showMain() {
      document.getElementById('registerSection').style.display = 'none'
      document.getElementById('mainSection').style.display = 'block'
      updateBadge()

      editColor = myColor
      editEmoji = myEmoji
      document.getElementById('editDrunkLevel').value = myDrunkLevel
      document.getElementById('editDrunkVal').textContent = myDrunkLevel

      const res  = await fetch('/api/people')
      const data = await res.json()
      const meRes = await fetch('/api/people/' + myId)
      const me    = await meRes.json()
      const knownIds = new Set(me.knows || [])

      const list = document.getElementById('peopleList')
      list.innerHTML = ''

      data.people
        .filter(p => p.id !== myId)
        .forEach(p => {
          const btn = document.createElement('button')
          btn.className = 'person-btn' + (knownIds.has(p.id) ? ' known' : '')
          const label = (p.emoji ? p.emoji + ' ' : '') + p.name
          btn.textContent = knownIds.has(p.id) ? '✓ ' + label : label
          btn.onclick = () => { void toggleKnow(p.id, btn, label, knownIds) }
          list.appendChild(btn)
        })
    }

    async function toggleKnow(personId, btn, label, knownIds) {
      const isKnown = knownIds.has(personId)
      await fetch('/api/know', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fromId: myId, toId: personId, knows: !isKnown })
      })
      if (isKnown) {
        knownIds.delete(personId)
        btn.classList.remove('known')
        btn.textContent = label
      } else {
        knownIds.add(personId)
        btn.classList.add('known')
        btn.textContent = '✓ ' + label
      }
    }

    function viewGraph() { globalThis.location.href = '/graph.html' }
  </script>
</body>
</html>
